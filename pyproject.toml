[project]
name = "cofre-senhas-hermes"
version = "1.1.0"
description = "Cofre local de equipamentos para operações NOC com Hermes"
readme = "README.md"
license = "MIT"
authors = [{ name = "Apolo" }]
requires-python = ">=3.11"
keywords = ["hermes-agent", "inventory", "noc", "ssh", "sqlite"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "asyncssh>=2.24,<3",
  "cryptography>=50,<51",
  "flask>=3.1,<4",
  "waitress>=3.0,<4",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
equipment-registry = "equipment_registry.cli:main"

[project.urls]
Homepage = "https://github.com/clfigueiredo/cofre-senha-hermes"
Repository = "https://github.com/clfigueiredo/cofre-senha-hermes"
Issues = "https://github.com/clfigueiredo/cofre-senha-hermes/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/equipment_registry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
